name: chargemy
description: ChargeMY is a Malaysian EV charging-station navigator.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  csv: ^6.0.0
  file_picker: ^8.1.7
  flutter_map: ^8.3.1
  flutter_riverpod: ^2.6.1
  geolocator: ^13.0.2
  go_router: ^14.8.1
  http: ^1.2.2
  image_picker: ^1.1.2
  latlong2: ^0.9.1
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^18.0.1
  flutter_stripe: ^11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true




